name: Dependency verification metadata

# Started by hand after a library or plugin changes. It writes gradle/verification-metadata.xml
# (SHA-256 of every library and plugin the build downloads) and prints it, gzipped and
# base64-encoded, between two markers in the log. Check the diff and commit the new file in
# the same push as the dependency change, or the normal build fails the verification.
on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Write verification metadata
        run: |
          chmod +x gradlew
          # Adds entries to the existing file and keeps its settings (the trusted sources and javadoc jars).
          # No secrets here: CI and GITHUB_ACTIONS are unset so the release build signs with the
          # debug key instead of refusing. It downloads the same libraries as the signed build.
          env -u CI -u GITHUB_ACTIONS ./gradlew --no-daemon --write-verification-metadata sha256 assembleRelease assembleDebug :app:dependencies --configuration releaseRuntimeClasspath

      - name: Print verification metadata
        run: |
          echo "----- BEGIN verification-metadata.xml.gz.b64 -----"
          gzip -9c gradle/verification-metadata.xml | base64 -w 0
          echo
          echo "----- END verification-metadata.xml.gz.b64 -----"
          sha256sum gradle/verification-metadata.xml
