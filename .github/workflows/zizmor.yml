name: Workflow audit

# zizmor checks the GitHub Actions workflows for security problems
# (unpinned actions, too-wide permissions, template injection, leaked credentials).
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install zizmor
        run: python -m pip install --require-hashes --no-deps -r .github/zizmor-requirements.txt

      - name: Audit workflows
        run: zizmor --offline .github/workflows
